services:
  backend:
    build: ./backend
    environment:
      LEDGERLENS_DATABASE_URL: sqlite:////data/ledgerlens.db
      LEDGERLENS_FRONTEND_ORIGIN: http://127.0.0.1:5173
    volumes:
      - ledgerlens_data:/data
    ports:
      - "127.0.0.1:8000:8000"
  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:5173:5173"
volumes:
  ledgerlens_data:
