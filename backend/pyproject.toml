[project]
name = "ledgerlens"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3", "alembic>=1.15,<2", "pydantic>=2.10,<3", "python-multipart>=0.0.20,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "hypothesis>=6,<7", "ruff>=0.11,<1", "mypy>=1.15,<2", "pre-commit>=4,<5"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ledgerlens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"] # FastAPI dependency declarations intentionally call Depends/File.

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
