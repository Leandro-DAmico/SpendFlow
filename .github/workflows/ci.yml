name: CI
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check ledgerlens tests alembic
      - run: ruff format --check ledgerlens tests alembic
      - run: mypy --strict ledgerlens
      - run: pytest -q
      - run: alembic upgrade head
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -e '.[dev]' && alembic upgrade head
        working-directory: backend
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: python -m uvicorn ledgerlens.api:app --host 127.0.0.1 --port 8000 > ../backend.log 2>&1 &
        working-directory: backend
      - run: npm run dev -- --host 127.0.0.1 > ../frontend.log 2>&1 &
        working-directory: frontend
      - run: |
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:5173/ >/dev/null && curl -fsS http://127.0.0.1:8000/api/health >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - run: npm run test:e2e
        working-directory: frontend
